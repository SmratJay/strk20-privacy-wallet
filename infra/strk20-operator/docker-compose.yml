# STRK20 operator infrastructure — deterministic local setup.
#
# Components (from the starknet-privacy compatibility matrix, tag PRIVACY-0.14.3-RC.2):
#   1. Discovery service  — indexes encrypted pool storage so wallets can sync notes.
#   2. Transaction prover — Stwo proving service (JSON-RPC starknet_proveTransaction).
#      ⚠️ EXTERNAL HEAVY DEPENDENCY: runs StarkWare's sequencer transaction-prover image
#      against a local Pathfinder node with PATHFINDER_STORAGE_STATE_TRIES=10000. It is
#      intentionally not bundled here (needs a funded Sepolia node + significant resources).
#
# Quick start (discovery service only):
#   cd infra/strk20-operator
#   cp .env.example .env   # set RPC_URL / WS_URL / ETHEREUM_API_URL
#   docker compose up -d discovery-service
#   curl http://localhost:8080/health
#
# Then point the app at:
#   NEXT_PUBLIC_STRK20_DISCOVERY_URL=http://localhost:8080
#   NEXT_PUBLIC_STRK20_PROVER_URL=<external prover URL>

services:
  discovery-service:
    image: ghcr.io/starkware-libs/starknet-privacy/discovery-service:PRIVACY-0.14.3-RC.2
    container_name: strk20-discovery
    restart: unless-stopped
    environment:
      # Point both at a Starknet Sepolia node that supports WebSocket indexing.
      RPC_URL: ${RPC_URL:-https://api.cartridge.gg/x/starknet/sepolia}
      WS_URL: ${WS_URL:-ws://pathfinder:9545}
      API_HOST: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - strk20

  # ---------------------------------------------------------------------------
  # Local Pathfinder node (Starknet Sepolia). Requires an Ethereum L1 RPC
  # (PATHFINDER_ETHEREUM_API_URL). PATHFINDER_STORAGE_STATE_TRIES=10000 is required by
  # the transaction prover.
  # ---------------------------------------------------------------------------
  pathfinder:
    image: eqlabs/pathfinder:v0.22.7
    container_name: strk20-pathfinder
    restart: unless-stopped
    environment:
      PATHFINDER_NETWORK: "sepolia-testnet"
      PATHFINDER_STORAGE_STATE_TRIES: "10000"
      PATHFINDER_ETHEREUM_API_URL: ${ETHEREUM_API_URL}
      PATHFINDER_HTTP_RPC_ENDPOINT: "0.0.0.0:9545"
      # Discovery service indexes via WebSocket — Pathfinder serves WS at /ws and it is
      # disabled by default.
      PATHFINDER_WEBSOCKET_ENABLED: "true"
      # 8 GB host: Pathfinder's default 4096 MiB compiler budget + 4096 MiB margin
      # computes 0 RPC compiler concurrency. Pin a fixed limit so the RPC server starts.
      PATHFINDER_RPC_COMPILER_CONCURRENCY_LIMIT: "1"
    ports:
      - "9545:9545"
      - "9546:9546"
    networks:
      - strk20

  prover:
    image: ghcr.io/starkware-libs/starknet-privacy/transaction-prover:PRIVACY-0.14.3-RC.2
    container_name: strk20-prover
    restart: unless-stopped
    environment:
      # The prover requires a Starknet node exposing the v0.10 JSON-RPC API.
      RPC_URL: http://pathfinder:9545/rpc/v0_10
      CHAIN_ID: SN_SEPOLIA
      PROVER_PORT: "3000"
      PROVER_IP: "0.0.0.0"
      MAX_CONCURRENT_REQUESTS: "1"
      RUST_LOG: info
    ports:
      # Host 3001 -> container 3000 (host 3000 is the Next.js dev server)
      - "3001:3000"
    networks:
      - strk20
    depends_on:
      - pathfinder

networks:
  strk20:
    driver: bridge